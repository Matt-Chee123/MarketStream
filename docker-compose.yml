services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  producer:
    build: ./producer
    container_name: market-producer
    depends_on:
      - broker
    environment:
      KAFKA_BROKER: broker:9092
    volumes:
      - producer_data:/app/data
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  persister:
    build:
      context: .
      dockerfile: consumers/persister/Dockerfile
    container_name: persister
    depends_on:
      - broker
    environment:
      KAFKA_BROKER: broker:9092
    restart: on-failure
  feature_processor:
    build:
      context: .
      dockerfile: consumers/feature_processor/Dockerfile
    container_name: feature-processor
    depends_on:
      - broker
      - redis
    environment:
      - KAFKA_BROKER=broker:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: on-failure
  anomaly_detector:
    build:
      context: .
      dockerfile: consumers/anomaly_detector/Dockerfile
    container_name: anomaly-detector
    depends_on:
      - broker
    environment:
      KAFKA_BROKER: broker:9092
    restart: on-failure
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - broker
      - db
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCHEMA_VERSION=v1
      - KAFKA_BROKER=broker:9092
    restart: on-failure
  synthetic_producer:
      build:
        context: .
        dockerfile: consumers/synthetic_producer/Dockerfile
      profiles: ["loadtest"]
      depends_on:
        - broker
      environment:
        KAFKA_BROKER: broker:9092
        TARGET_RATE: "30000"
        DURATION_S: "300"
      deploy:
        replicas: 4

volumes:
  producer_data:
  timescale_data:
